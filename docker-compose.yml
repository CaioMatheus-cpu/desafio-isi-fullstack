# Um único comando sobe tudo (banco, API e interface):
#   docker compose up --build
# Só o banco, para rodar a API e a interface na máquina:
#   docker compose up -d db
services:
  db:
    image: postgres:16
    container_name: desafio-db
    environment:
      POSTGRES_USER: desafio
      POSTGRES_PASSWORD: desafio
      POSTGRES_DB: desafio
    # O banco só aceita conexões da própria máquina, nunca da rede.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desafio -d desafio"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: desafio-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://desafio:desafio@db:5432/desafio
      CORS_ORIGIN: http://localhost:5173
      PORT: "3000"
    ports:
      - "3000:3000"
    # A API só é considerada pronta quando responde (depois das migrations).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/v1/clubs || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000/api/v1
    container_name: desafio-web
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  pgdata:
